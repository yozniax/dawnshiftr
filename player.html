<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DAWNSHIFTr</title>
    <link rel="icon" href="icons/icon32.png?v=dawn" />
    <link rel="stylesheet" href="css/player.css" />
  </head>
  <body>
    <div id="app">
      <header class="top">
        <div class="brand"><span class="dawn">DAWN</span>SHIFT<span class="r">r</span></div>
        <span id="now-kicker">STOPPED</span>
      </header>

      <section class="now-card">
        <h1 class="now-title" id="track-title">PICK A STATION</h1>
        <p class="song empty" id="song-title">&nbsp;</p>
        <p class="now-note empty" id="now-note" hidden></p>
        <div class="transport">
          <button type="button" class="icon-btn" id="btn-prev" title="Previous">‹</button>
          <button type="button" class="play-btn" id="btn-play" title="Play / pause">▶</button>
          <button type="button" class="icon-btn" id="btn-next" title="Next">›</button>
          <label class="vol">
            <span>VOL</span>
            <input id="vol-slider" type="range" min="0" max="100" value="80" />
          </label>
          <div class="sleep-wrap">
            <button type="button" id="sleep-label">SLEEP</button>
            <div class="chips" id="sleep-line"></div>
          </div>
        </div>
        <canvas class="eq-vis" id="eq-vis" height="40" aria-hidden="true"></canvas>
      </section>

      <section class="stations">
        <div class="station-toolbar">
          <div class="toolbar-btns">
            <button type="button" data-pane="index" class="on">INDEX</button>
            <button type="button" data-pane="fav">FAV</button>
            <button type="button" data-pane="stations">STATIONS</button>
            <button type="button" data-pane="history">HISTORY</button>
            <button type="button" data-pane="countries">COUNTRIES</button>
          </div>
          <input id="pane-search" type="search" placeholder="SEARCH…" hidden />
        </div>
        <div class="list" id="list" tabindex="0"></div>
      </section>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="toast" id="toast"></div>
    <script type="module" src="js/player.js"></script>
  </body>
</html>

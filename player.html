<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DAWNSHIFTR by DoYoBe</title>
    <link rel="icon" href="icons/icon32.png?v=dawn" />
    <link rel="stylesheet" href="css/player.css" />
  </head>
  <body>
    <div id="app">
      <header class="top">
        <div class="brand"><span class="dawn">DAWN</span>SHIFT<span class="tail">R</span><span class="by">by <a href="https://www.doyo.be/" target="_blank" rel="noopener noreferrer">DoYoBe</a></span></div>
        <div class="top-right">
          <a class="help-btn" id="btn-coffee" href="https://buymeacoffee.com/yozniax" target="_blank" rel="noopener noreferrer" title="BUY ME A COFFEE" aria-label="BUY ME A COFFEE">☕</a>
          <button type="button" class="help-btn" id="btn-help" title="KEYBIND" aria-label="KEYBIND">ℹ</button>
        </div>
      </header>

      <section class="now-card">
        <div class="now-copy">
          <h1 class="now-title" id="track-title">PICK A STATION</h1>
          <div class="song-slot"><span id="song-title"></span></div>
        </div>
        <div class="transport">
          <button type="button" class="play-btn" id="btn-play" title="PLAY/PAUSE" aria-label="PLAY/PAUSE">▶</button>
          <label class="vol" title="VOL">
            <input id="vol-slider" type="range" min="0" max="100" value="80" title="VOL" />
          </label>
          <div class="sleep-wrap">
            <button type="button" id="sleep-label">SLEEP</button>
            <div class="chips" id="sleep-line"></div>
          </div>
        </div>
        <canvas class="eq-vis" id="eq-vis" height="48" aria-hidden="true"></canvas>
      </section>

      <section class="stations">
        <div class="station-toolbar">
          <div class="toolbar-btns">
            <button type="button" data-pane="fav" class="on">FAV</button>
            <button type="button" data-pane="stations">STATIONS</button>
            <button type="button" data-pane="history">HISTORY</button>
            <button type="button" data-pane="countries">COUNTRIES</button>
          </div>
          <input id="pane-search" type="search" placeholder="SEARCH FAV…" />
        </div>
        <div class="list" id="list" tabindex="0"></div>
      </section>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="toast" id="toast"></div>
    <script type="module" src="js/player.js"></script>
  </body>
</html>

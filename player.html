<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DAWNSHIFTr</title>
    <link rel="icon" href="icons/icon32.png" />
    <link rel="stylesheet" href="css/player.css" />
  </head>
  <body>
    <div id="app">
      <header class="top">
        <div class="brand"><span class="dawn">DAWN</span>SHIFT<span class="r">r</span></div>
        <div class="top-meta">
          <span id="source-label">RADIO</span>
        </div>
      </header>

      <section class="now-card">
        <p class="kicker" id="now-kicker">STOPPED</p>
        <h1 class="now-title" id="track-title">PICK A STATION</h1>
        <p class="song" id="song-title">NO TITLE YET</p>
        <p class="now-note" id="now-note" hidden></p>
        <div class="transport">
          <button type="button" class="icon-btn" id="btn-prev" title="Previous">‹</button>
          <button type="button" class="play-btn" id="btn-play" title="Play / pause">▶</button>
          <button type="button" class="icon-btn" id="btn-next" title="Next">›</button>
          <label class="vol">
            <span>VOL</span>
            <input id="vol-slider" type="range" min="0" max="100" value="80" />
          </label>
        </div>
        <div class="sleep-wrap">
          <div class="row-label">
            <button type="button" id="sleep-label">SLEEP</button>
          </div>
          <div class="chips" id="sleep-line"></div>
        </div>
        <canvas class="eq-vis" id="eq-vis" height="40" aria-hidden="true"></canvas>
      </section>

      <section class="stations">
        <div class="station-toolbar">
          <input id="station-filter" type="search" placeholder="FILTER BY NAME OR NOTE" />
          <div class="toolbar-btns">
            <button type="button" data-act="fav">★</button>
            <button type="button" data-act="radio">TUNE</button>
            <button type="button" data-act="country">COUNTRY</button>
          </div>
        </div>
        <div class="list" id="list"></div>
      </section>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="toast" id="toast"></div>
    <script type="module" src="js/player.js"></script>
  </body>
</html>
